<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 1rem;
      background-color: white;
    }

    h2 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 0.75rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #1f2937;
      color: white;
    }

    td img {
      width: 60px;
      border-radius: 8px;
    }

    input.qty {
      width: 50px;
      text-align: center;
    }

    .remove-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #dc2626;
    }

    .cart-summary {
      text-align: right;
      margin-top: 1rem;
      font-size: 1.2rem;
    }

    .cart-summary .total {
      font-weight: bold;
      color: #ef8f00;
    }

    .checkout-btn {
      margin-top: 1rem;
      padding: 0.7rem 1.5rem;
      background-color: #febd69;
      color: #232f3e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background-color: #ff9900;
    }

    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        border: 1px solid #ddd;
        margin-bottom: 1rem;
        padding: 1rem;
        border-radius: 8px;
      }

      td {
        padding: 0.5rem;
        text-align: left;
      }

      td::before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
      }

      .cart-summary {
        text-align: center;
      }

      .checkout-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Your Shopping Cart</h1>
  </header>

  <main>
    <h2>Cart Items</h2>
    <table id="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Image</th>
          <th>Price (₹)</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Cart items go here -->
      </tbody>
    </table>

    <div class="cart-summary">
      Total: <span class="total">₹0</span><br />
      <button class="checkout-btn" onclick="window.location.href='payment.html'">Proceed to Payment</button>
    </div>
  </main>

  <script>
    const sampleCart = [
      {
        name: "Wireless Mouse",
        image: "https://via.placeholder.com/60",
        price: 499,
        quantity: 1
      },
      {
        name: "Bluetooth Headphones",
        image: "https://via.placeholder.com/60",
        price: 999,
        quantity: 2
      }
    ];

    // Initialize cart if empty
    if (!localStorage.getItem("cart")) {
      localStorage.setItem("cart", JSON.stringify(sampleCart));
    }

    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const tableBody = document.querySelector('#cart-table tbody');
      tableBody.innerHTML = '';
      let grandTotal = 0;

      cart.forEach((item, index) => {
        const total = item.price * item.quantity;
        grandTotal += total;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td data-label="Product">${item.name}</td>
          <td data-label="Image"><img src="${item.image}" alt="${item.name}" /></td>
          <td data-label="Price (₹)">${item.price}</td>
          <td data-label="Quantity"><input type="number" class="qty" min="1" value="${item.quantity}" data-index="${index}" /></td>
          <td data-label="Total">₹${total}</td>
          <td data-label="Action"><button class="remove-btn" data-index="${index}">Remove</button></td>
        `;
        tableBody.appendChild(row);
      });

      document.querySelector('.cart-summary .total').textContent = `₹${grandTotal}`;

      // Quantity update
      document.querySelectorAll('.qty').forEach(input => {
        input.addEventListener('change', (e) => {
          const idx = e.target.dataset.index;
          const newQty = Math.max(1, parseInt(e.target.value));
          cart[idx].quantity = newQty;
          localStorage.setItem('cart', JSON.stringify(cart));
          loadCart();
        });
      });

      // Remove item
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          cart.splice(idx, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          loadCart();
        });
      });
    }

    window.onload = loadCart;
  </script>
</body>
</html>
