<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shopping Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    header, footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    nav {
      background-color: #37475a;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      background-color: #475569;
    }

    nav a:hover {
      background-color: #febd69;
      color: black;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 1rem;
      background-color: white;
    }

    h2 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.75rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #1f2937;
      color: white;
    }

    td img {
      width: 60px;
      border-radius: 6px;
    }

    .remove-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #dc2626;
    }

    .cart-summary {
      margin-top: 1rem;
      text-align: right;
    }

    .cart-summary .total {
      font-weight: bold;
      font-size: 1.4rem;
      color: #ef8f00;
    }

    .checkout-btn {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background-color: #febd69;
      color: #232f3e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .checkout-btn:hover {
      background-color: #ff9900;
    }

    /* Responsive for Mobile */
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 1rem;
        border: 1px solid #ddd;
        padding: 0.5rem;
        border-radius: 8px;
        background-color: #f9fafb;
      }

      td {
        text-align: left;
        padding: 0.5rem 0;
      }

      td::before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
        margin-bottom: 0.3rem;
        color: #6b7280;
      }

      .cart-summary {
        text-align: center;
      }

      .checkout-btn {
        width: 100%;
        margin-top: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>MyCart</h1>
  </header>

  <main>
    <h2>Your Shopping Cart</h2>
    <table id="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Image</th>
          <th>Price (₹)</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Cart Items Here -->
      </tbody>
    </table>

    <div class="cart-summary">
      <div>Total Amount: <span class="total">₹0</span></div>
      <button class="checkout-btn" onclick="window.location.href='payment.html'">Proceed to Payment</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 MyCart. All rights reserved.</p>
  </footer>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const tableBody = document.querySelector('#cart-table tbody');
      tableBody.innerHTML = '';

      let grandTotal = 0;

      cart.forEach((item, index) => {
        const total = item.price * item.quantity;
        grandTotal += total;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td data-label="Product">${item.name}</td>
          <td data-label="Image"><img src="${item.image}" alt="${item.name}" /></td>
          <td data-label="Price (₹)" class="price">${item.price}</td>
          <td data-label="Quantity"><input type="number" class="qty" value="${item.quantity}" min="1" data-index="${index}" style="width: 60px;" /></td>
          <td data-label="Total" class="total-price">${total}</td>
          <td data-label="Action"><button class="remove-btn" data-index="${index}">Remove</button></td>
        `;
        tableBody.appendChild(row);
      });

      document.querySelector('.cart-summary .total').textContent = `₹${grandTotal}`;

      document.querySelectorAll('.qty').forEach(input => {
        input.addEventListener('change', (e) => {
          const cart = JSON.parse(localStorage.getItem('cart'));
          const idx = e.target.dataset.index;
          cart[idx].quantity = Math.max(1, parseInt(e.target.value));
          localStorage.setItem('cart', JSON.stringify(cart));
          loadCart();
        });
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cart = JSON.parse(localStorage.getItem('cart'));
          cart.splice(e.target.dataset.index, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          loadCart();
        });
      });
    }

    window.onload = loadCart;
  </script>
</body>
</html>
