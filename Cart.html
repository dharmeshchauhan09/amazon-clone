<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shopping Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    header, footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1.5rem;
    }

    nav {
      background-color: #37475a;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      background-color: #475569;
    }

    nav a:hover {
      background-color: #febd69;
      color: black;
    }

    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 1rem;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }

    th, td {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #1f2937;
      color: white;
    }

    td img {
      width: 60px;
      border-radius: 8px;
    }

    .remove-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #dc2626;
    }

    .cart-summary {
      text-align: right;
      font-size: 1.2rem;
    }

    .cart-summary .total {
      font-weight: bold;
      font-size: 1.5rem;
      color: #ef8f00;
    }

    .checkout-btn {
      margin-top: 1rem;
      padding: 0.7rem 1.5rem;
      background-color: #febd69;
      color: #232f3e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background-color: #ff9900;
    }
  </style>
</head>
<body>
  <div id="header"></div>
  <main>
    <h2>Your Shopping Cart</h2>
    <table id="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Image</th>
          <th>Price (₹)</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dynamic cart items will be loaded here -->
      </tbody>
    </table>

    <div class="cart-summary">
      <div>Total Amount: <span class="total">₹0</span></div>
      <button class="checkout-btn" onclick="window.location.href='payment.html'">Proceed to Payment</button>
    </div>
  </main>
  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const tableBody = document.querySelector('#cart-table tbody');
      tableBody.innerHTML = ''; // Clear previous rows
  
      let grandTotal = 0;
  
      cart.forEach((item, index) => {
        const row = document.createElement('tr');
        const total = item.price * item.quantity;
        grandTotal += total;
  
        row.innerHTML = `
          <td>${item.name}</td>
          <td><img src="${item.image}" alt="${item.name}" /></td>
          <td class="price">${item.price}</td>
          <td><input type="number" class="qty" value="${item.quantity}" min="1" data-index="${index}" style="width: 50px;" /></td>
          <td class="total-price">${total}</td>
          <td><button class="remove-btn" data-index="${index}">Remove</button></td>
        `;
        tableBody.appendChild(row);
      });
  
      // Update summary
      document.querySelector('.cart-summary .total').textContent = `₹${grandTotal}`;
  
      // Quantity change handler
      document.querySelectorAll('.qty').forEach(input => {
        input.addEventListener('change', (e) => {
          const cart = JSON.parse(localStorage.getItem('cart'));
          const idx = e.target.dataset.index;
          cart[idx].quantity = Math.max(1, parseInt(e.target.value));
          localStorage.setItem('cart', JSON.stringify(cart));
          loadCart();
        });
      });
  
      // Remove button handler
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cart = JSON.parse(localStorage.getItem('cart'));
          cart.splice(e.target.dataset.index, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          loadCart();
        });
      });
    }

    window.onload = loadCart;
  </script>

  <div id="footer"></div>
  <script src="index.js"></script>
</body>
</html>
