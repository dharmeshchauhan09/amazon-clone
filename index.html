<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Clone - Home</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }

    nav {
      background-color: #37475a;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }

    nav a {
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    nav a:hover {
      background-color: #febd69;
      color: #232f3e;
    }

    .hero {
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1515165562835-cd4fdf9f1a6a');
      background-size: cover;
      background-position: center;
      padding: 4rem 2rem;
      text-align: center;
      color: white;
      z-index: 1;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    .hero h2,
    .hero p {
      position: relative;
      z-index: 2;
      color: white;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.3rem;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      padding: 2rem;
    }

    .product-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      display: block;
      padding: 10px;
      background-color: #f9fafb;
    }

    .product-card .details {
      padding: 1rem;
      text-align: center;
    }

    .product-card .details h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #111827;
    }

    .product-card .details p {
      color: #4b5563;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    .product-card .details button {
      background-color: #febd69;
      border: none;
      padding: 0.5rem 1rem;
      color: #232f3e;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .product-card .details button:hover {
      background-color: #f3a847;
    }

    footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <section class="hero">
    <h2>Welcome to Amazon Clone</h2>
    <p>Your one-stop shop for everything you love.</p>
  </section>

  <section class="products">
    <div class="product-card">
      <img src="Wireless Headphones.jpg" alt="Wireless Headphones">
      <div class="details">
        <h3>Wireless Headphones</h3>
        <p>₹1999</p>
        <button class="add-to-cart" data-name="Wireless Headphones" data-price="1999" data-image="Wireless Headphones.jpg">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="smartwatch.jpg" alt="Smart Watch">
      <div class="details">
        <h3>Smart Watch</h3>
        <p>₹2499</p>
        <button class="add-to-cart" data-name="Smart Watch" data-price="2499" data-image="smartwatch.jpg">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="Bluetooth Speaker.webp" alt="Bluetooth Speaker">
      <div class="details">
        <h3>Bluetooth Speaker</h3>
        <p>₹1299</p>
        <button class="add-to-cart" data-name="Bluetooth Speaker" data-price="1299" data-image="Bluetooth Speaker.webp">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="Fitness Tracker.jpg" alt="Fitness Tracker">
      <div class="details">
        <h3>Fitness Tracker</h3>
        <p>₹1799</p>
        <button class="add-to-cart" data-name="Fitness Tracker" data-price="1799" data-image="Fitness Tracker.jpg">Add to Cart</button>
      </div>
    </div>
  </section>

  <script>
    $(document).ready(function () {
      $('.add-to-cart').click(function () {
        const productName = $(this).data('name');
        const productPrice = parseFloat($(this).data('price'));
        const productImage = $(this).data('image');
  
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
  
        // Check if product already exists in cart
        const existingProduct = cart.find(item => item.name === productName);
  
        if (existingProduct) {
          existingProduct.quantity += 1; // Increase quantity
        } else {
          cart.push({
            name: productName,
            price: productPrice,
            image: productImage,
            quantity: 1 // Initial quantity
          });
        }
  
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(`${productName} added to cart!`);
      });
    });
  </script>
  

  <div id="footer"></div>
  <script src="index.js"></script>
</body>
</html>
