<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Page</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.8rem;
    }

    main {
      max-width: 600px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 0.8rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .hidden {
      display: none;
    }

    button {
      width: 100%;
      padding: 1rem;
      background-color: #febd69;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: #232f3e;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #ff9900;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #232f3e;
      color: white;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
<main>
  <h2>Choose Your Payment Method</h2>
  <form id="paymentForm">

    <label for="paymentMethod">Payment Method</label>
    <select id="paymentMethod" name="payment-method" onchange="handlePaymentChange()">
      <option value="card">Credit Card</option>
      <option value="upi">UPI</option>
      <option value="cod">Cash on Delivery</option>
    </select>

    <!-- Card Fields -->
    <div id="cardFields">
      <label for="cardNumber">Card Number</label>
      <input type="text" id="cardNumber" name="card-number" placeholder="1234 5678 9012 3456" required>

      <label for="expiry">Expiry Date</label>
      <input type="month" id="expiry" name="expiry-date" required>

      <label for="cvv">CVV</label>
      <input type="text" id="cvv" name="cvv" placeholder="123" required>
    </div>

    <!-- UPI Field -->
    <div id="upiField" class="hidden">
      <label for="upiId">UPI ID</label>
      <input type="text" id="upiId" name="upi-id" placeholder="yourname@upi">
    </div>

    <!-- COD Message -->
    <div id="codMessage" class="hidden">
      <p style="margin-top: 1rem;">You chose Cash on Delivery. Please confirm your order on the next page.</p>
    </div>

    <button type="submit">Proceed to Pay</button>
  </form>
</main>
<script>
  function handlePaymentChange() {
    const method = document.getElementById("paymentMethod").value;

    document.getElementById("cardFields").classList.add("hidden");
    document.getElementById("upiField").classList.add("hidden");
    document.getElementById("codMessage").classList.add("hidden");

    document.getElementById("cardNumber").required = false;
    document.getElementById("expiry").required = false;
    document.getElementById("cvv").required = false;
    document.getElementById("upiId").required = false;

    if (method === "card") {
      document.getElementById("cardFields").classList.remove("hidden");
      document.getElementById("cardNumber").required = true;
      document.getElementById("expiry").required = true;
      document.getElementById("cvv").required = true;
    } else if (method === "upi") {
      document.getElementById("upiField").classList.remove("hidden");
      document.getElementById("upiId").required = true;
    } else if (method === "cod") {
      document.getElementById("codMessage").classList.remove("hidden");
    }
  }

  // Initialize on load
  window.onload = handlePaymentChange;

  // Handle form submission
  document.getElementById("paymentForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const method = document.getElementById("paymentMethod").value;
    let paymentData = { method: method };

    if (method === "card") {
      paymentData.cardNumber = document.getElementById("cardNumber").value;
      paymentData.expiry = document.getElementById("expiry").value;
      paymentData.cvv = document.getElementById("cvv").value;
    } else if (method === "upi") {
      paymentData.upiId = document.getElementById("upiId").value;
    }

    // Store payment data in sessionStorage
    sessionStorage.setItem("paymentData", JSON.stringify(paymentData));

    // Redirect to confirm-payment.html
    window.location.href = "confirm-payment.html";
  });
</script>
<div id="footer"></div>
<script src="index.js"></script>
</body>
</html>
